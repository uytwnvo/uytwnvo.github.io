<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  
   <style>
     header {
  background: linear-gradient(135deg, #ff6b6b, #ffa06b);
  color: white;
  padding: 50px 30px;
  border-radius: 12px;
  margin-bottom: 20px;
}
header h1 {
  color: white;
  margin: 0 0 10px 0;
}
header p {
  color: white;
  opacity: 0.9;
  margin: 0;
}
  body {
    font-family: "Helvetica Neue", Arial, sans-serif;
    max-width: 700px;
    margin: 60px auto;
    padding: 0 20px;
    line-height: 1.7;
    color: #2b2b2b;
    background: #fafafa;
  }
  h1 {
    font-size: 2.2em;
    margin-bottom: 4px;
  }
  h2 {
    margin-top: 50px;
    font-size: 1.3em;
    border-left: 6px solid #ff6b6b;
    padding-left: 12px;
  }
  ul {
    padding: 0;
  }
  li {
    list-style: none;
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s;
  }
  li:hover {
    transform: translateY(-3px);
  }
  a {
    color: #2f4f4f;
    font-weight: bold;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <header>
  <h1>あなたの名前</h1>
  <p>ここに簡単な自己紹介を書く。</p>
</header>

  <h2>作品一覧</h2>
  <ul>
    <li>

    </li>
    <li>

    </li>
  </ul>

</body>
</html>
