<!DOCTYPE html>
<html lang="ja">

   <style>
li img {
  width: 100%;
  border-radius: 8px;
  margin-bottom: 12px;
  object-fit: contain;
  display: block;
}
     header {
  background-image: linear-gradient(135deg, rgba(255,107,107,0.85), rgba(255,160,107,0.85)), url('header-bg.jpg.jpg');
  background-size: cover;
  background-position: center;
  color: white;
  padding: 50px 30px;
  border-radius: 12px;
  margin-bottom: 20px;
}
header h1 {
  color: white;
  margin: 0 0 10px 0;
}
header p {
  color: white;
  opacity: 0.9;
  margin: 0;
}
  body {
    font-family: "M PLUS Rounded 1c", sans-serif;
    max-width: 900px;
    margin: 60px auto;
    padding: 0 20px;
    line-height: 1.7;
    color: #2b2b2b;
    background: linear-gradient(135deg, #fff0eb, #fff8f0);
    display: flex;
    gap: 40px;
    align-items: flex-start;
  }
  h1 {
    font-size: 2.2em;
    margin-bottom: 4px;
  }
  h2 {
    margin-top: 50px;
    font-size: 1.3em;
    border-left: 6px solid #ff6b6b;
    padding-left: 12px;
  }
  ul {
    padding: 0;
  }
  li {
    list-style: none;
    background: white;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s;
  }
  li:hover {
    transform: translateY(-3px);
  }
  a {
    color: #2f4f4f;
    font-weight: bold;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }
     .sidebar {
  width: 150px;
  flex-shrink: 0;
  position: sticky;
  top: 60px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

main {
  flex: 1;
  min-width: 0;
}

  gap: 10px;
}
.sidebar a {
  background: white;
  color: #2b2b2b;
  text-decoration: none;
  font-weight: bold;
  padding: 10px 14px;
  border-radius: 8px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  text-align: center;
}
.sidebar a:hover {
  color: #ff6b6b;
}
main {
  flex: 1;
  min-width: 0;
}
</style>
</head>
